# TomiloLib — tomilo-lib.ru
# API: /api (без ключа), картинки на S3 CDN
id: tomilolib
kind: mihon
name: Tomilo-lib
class_name: TomiloLib
package: ru.tomilolib
base_url: https://tomilo-lib.ru
lang: ru
api_style: json_api_v2
nsfw: false
version: 1.0.0
ext_version_code: 6
source_id: 7420534233267322527
content_warning: MIXED

api:
  base: https://tomilo-lib.ru/api
  media_base: https://cdn.tomilo-lib.ru
  media_strip: "/uploads"
  media_proxy: "https://tomilo-lib.ru/_next/image?url={url}&w=640&q=82"
  rate: 4
  list:
    path: /titles
    items: data.titles
    page_param: page
    size_param: limit
    size: 30
    query_param: search
    sort_param: sortBy
    sorts:
    - id: views
      label: Популярное
      value: views
    - id: updated
      label: Дата обновления
      value: updatedAt
    - id: created
      label: Дата добавления
      value: createdAt
    - id: rating
      label: Рейтинг
      value: averageRating
    - id: name
      label: По алфавиту
      value: name
    - id: year
      label: Год выпуска
      value: releaseYear
    - id: chapters
      label: Кол-во глав
      value: totalChapters
    default_sort: views
    latest_sort: updatedAt
    extra_params:
      order: desc
    total_pages: data.pagination.pages
    current_page: data.pagination.page
    fields:
      id: _id
      title: name
      cover: coverImage
      description: description
      status: status
      author: author
      artist: artist
      genres: genres
  details:
    path: /titles/{id}
    root: data
  chapters:
    steps:
    - path: /chapters
      params:
        titleId: '{id}'
        limit: '500'
      items: data.chapters
      paged:
        page_param: page
        start: 1
        total_pages: data.pagination.pages
      fields:
        chapter_id: _id
        chapter_number: chapterNumber
        chapter_title: name
        chapter_date: releaseDate
  pages:
    path: /chapters/{chapter}
    items: data.pages
    image: ''
  filters:
  - class: TypeFilter
    name: Тип
    param: type
    values:
    - - ''
      - Все
    - - manga
      - Манга
    - - manhwa
      - Манхва
    - - manhua
      - Маньхуа
    - - comic
      - Комикс
  - class: StatusFilter
    name: Статус
    param: status
    values:
    - - ''
      - Любой
    - - ongoing
      - Онгоинг
    - - completed
      - Завершён
    - - pause
      - Приостановлен
  genres:
    source: catalog
    base: https://tomilo-lib.ru/api
    path: /titles
    items: data.titles
    field: genres
    extra: "sortBy=views&order=desc"
    param: genres
