# AniMaunt — animaunt.org. Конфиг снят с живой вёрстки (DLEDetect), 2026-10-31.
id: animaunt
kind: aniyomi
name: "AniMaunt"
base_url: https://animaunt.org
lang: ru
api_style: html
nsfw: false
rating: mixed
html:
  catalog: "/anime/"
  latest: "/anime/"
  search: "/?do=search&subaction=search&story={query}"
  page_suffix: "page/{page}/"
  page_marker: "page/"
  link_re: "/\\d+-[a-z0-9\\-]+\\.html"
  title_sel: "h1"
  poster_sel: "img"
  desc_sel: ".fdesc.full-text"
  genre_sel: "a[href*=\"/genres/\"]"
  player_mode: "iframe"
