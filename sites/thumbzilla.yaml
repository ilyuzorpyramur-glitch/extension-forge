    search_path: ""       # TODO: например "/search?q={query}"
    items: "a[href*=\"/watch/\"]"
    link: "a[href*=\"/watch/\"]"
    cover: "img"
    has_next: ""          # TODO: селектор кнопки "далее", если список постраничный
  details:
    title: { selector: "h1" }   # TODO: проверить на странице тайтла
